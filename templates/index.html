<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOC CONSOLE · Network Operations Center</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
        },
        colors: {
          base: {
            950: '#070c17',
            900: '#0b1220',
            850: '#0e1626',
            800: '#111a2e',
            700: '#1a2540',
            600: '#233150',
            border: '#1e2a45',
          },
          cyan: {
            glow: '#22d3ee',
          },
        },
      },
    },
  }
</script>

<style>
  body {
    background-color: #070c17;
    background-image:
      linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .panel {
    background: linear-gradient(180deg, #0e1626 0%, #0b1220 100%);
    border: 1px solid #1e2a45;
  }
  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100vh;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 50;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0b1220; }
  ::-webkit-scrollbar-thumb { background: #233150; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2e3f66; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
  }
  .live-dot { animation: pulse-dot 2s infinite; }
</style>
<link rel="stylesheet" href="/static/vpn/command-center.css">
<link rel="stylesheet" href="/static/vpn/obsidian.css?v=dropdown-visibility-20261028">
<link rel="stylesheet" href="/static/vpn/header-network.css">
<link rel="stylesheet" href="/static/vpn/lab-polish.css">
</head>

<body class="font-sans text-slate-300 min-h-screen relative">
<div class="scanline"></div>

<!-- HEADER -->
<header class="border-b border-base-border bg-base-900/90 backdrop-blur sticky top-0 z-40">
  <div class="noc-nav-shell max-w-7xl mx-auto px-4 sm:px-6 py-2.5">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center shrink-0">
        <svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Georgian flag logo" class="w-8 h-auto rounded-sm"><rect width="30" height="20" fill="#fff"/><path d="M13.5 0h3v20h-3zM0 8.5h30v3H0z" fill="#da291c"/><g fill="#da291c"><path d="M6 2.7h1.4v1.6H9v1.4H7.4v1.6H6V5.7H4.4V4.3H6z"/><path d="M22.6 2.7H24v1.6h1.6v1.4H24v1.6h-1.4V5.7H21V4.3h1.6zM6 12.7h1.4v1.6H9v1.4H7.4v1.6H6v-1.6H4.4v-1.4H6zM22.6 12.7H24v1.6h1.6v1.4H24v1.6h-1.4v-1.6H21v-1.4h1.6z"/></g></svg>
      </div>
      <div>
        <h1 class="font-mono text-xs sm:text-sm font-bold text-slate-100 tracking-wider">NOC // CONSOLE</h1>
      </div>
    </div>
    
    <section class="noc-header-network" aria-label="Network Information">
      <dl class="noc-header-metrics">
        <div class="noc-header-metric noc-header-ip"><dt>Public IP Address</dt><dd id="geo-ip-display">Checking...</dd></div>
        <div class="noc-header-metric"><dt>ISP / Provider</dt><dd id="geo-isp">Checking...</dd></div>
      </dl>
    </section>
    <div class="noc-nav-status flex items-center gap-2 sm:gap-2.5 font-mono text-[11px] sm:text-xs text-slate-400 flex-wrap">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>
        <span id="clock" class="text-[10px] sm:text-xs">Synchronizing...</span>
      </div>
      
      <span class="text-slate-600 hidden xs:inline">|</span>
      
      <span class="text-[10px] tracking-widest text-cyan-300/80">NETWORK OPERATIONS</span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6">

  {% include 'vpn/configurator.html' %}

</main>

<script>
  function formatLocalClock(date) {
    return date.toLocaleString('en-GB', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).replace(',', '');
  }
  
  function tickClock() {
    const el = document.getElementById('clock');
    if (el) el.textContent = formatLocalClock(new Date());
  }
  tickClock();
  setInterval(tickClock, 1000);

</script>

<script type="module" src="/static/vpn/network-info-ui.js"></script>
</body>
</html>
