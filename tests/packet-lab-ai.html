<!doctype html><html lang="en"><meta charset="utf-8"><title>Local AI lab UI regression</title><body><pre id="results">Running</pre><div id="fixture"></div><script type="module">
import {mountPacketLab} from '../static/vpn/packet-lab-ui.js';
const q=s=>document.querySelector(s);let checks=0,invalid=false,lastRequest;
const check=(name,ok)=>{if(!ok)throw Error(name);checks++;};
const wait=async fn=>{for(let n=0;n<200;n++){if(fn())return;await new Promise(r=>setTimeout(r,20));}throw Error('UI state timed out');};
const original=window.fetch;window.fetch=async(url,options)=>{if(!String(url).startsWith('http://127.0.0.1:8767'))return original(url,options);check('temporary auth header',options.headers.Authorization==='Bearer synthetic-test-token');if(String(url).endsWith('/health'))return new Response(JSON.stringify({ok:true,models:['qwen3-vl:4b']}));lastRequest=JSON.parse(options.body);return new Response(JSON.stringify({plan:{summary:'Reviewed two-device draft',uncertainties:['Confirm switch model'],devices:[{name:'S1',kind:'switch',interfaces:'FastEthernet0/1,,PC-A\nVlan1,192.168.1.11/24',services:[{id:invalid?'unknown':'vlan',data:{vlan:'10',name:'Students',interface:'FastEthernet0/1',mode:'access'}}]},{name:'PC-A',kind:'host',interfaces:'Ethernet0,192.168.10.3/24',gateway:'192.168.10.1',services:[]}]}}));};
try{
 const cleanup=mountPacketLab(q('#fixture'));q('#fixture details').open=true;
 q('[data-pt-add]').click();q('.pt-device input[aria-label="Hostname / device name"]').value='PREVIOUS';q('.pt-device input[aria-label="Hostname / device name"]').dispatchEvent(new Event('input'));
 const bytes=new Blob([Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAI0lEQVR4nGP8//8/AymAiSTVDKMaiANMRKqDg1ENxACSQwkAVW0DHeN02ZEAAAAASUVORK5CYII='),x=>x.charCodeAt(0))],{type:'image/png'}),transfer=new DataTransfer();transfer.items.add(new File([bytes],'fixture.png',{type:'image/png'}));q('[data-pt-file]').files=transfer.files;q('[data-pt-file]').dispatchEvent(new Event('change'));await wait(()=>!q('[data-pt-ocr]').disabled);
 q('[data-pt-ai-token]').value='synthetic-test-token';q('[data-pt-ai-token]').dispatchEvent(new Event('input'));q('[data-pt-task]').value='Configure VLAN 10 from the image';q('[data-pt-ai-connect]').click();await wait(()=>q('[data-pt-ai-status]').textContent.includes('Connected.'));check('model health displayed',q('[data-pt-ai-status]').textContent.includes('qwen3-vl:4b'));
 q('[data-pt-ai-analyze]').click();await wait(()=>q('[data-pt-ai-status]').textContent.includes('Imported 2'));
 check('image sent only to local helper',lastRequest.images.length===1&&lastRequest.images[0].length>100);check('assignment sent',lastRequest.task.includes('VLAN 10'));check('catalog supplied',lastRequest.catalog.includes('lab_trunk'));check('two editable device forms',q('[data-pt-devices]').children.length===2);check('alphabetic host name kept',q('[data-pt-devices]').textContent.includes('Device 2'));check('uncertainty visible',q('[data-pt-ai-report]').textContent.includes('Confirm switch model'));check('review remains unchecked',!q('[data-pt-reviewed]').checked);check('no automatic CLI export',q('[data-pt-results]').children.length===0);
 invalid=true;q('[data-pt-ai-analyze]').click();await wait(()=>q('[data-pt-ai-status]').textContent.includes('unsupported service'));check('invalid AI result does not replace good forms',q('[data-pt-devices]').children.length===2);
 q('[data-pt-ai-undo]').click();check('previous device restored',q('[data-pt-devices] input[aria-label="Hostname / device name"]').value==='PREVIOUS');q('[data-pt-clear]').click();check('clear removes token',q('[data-pt-ai-token]').value==='');check('clear removes AI report',q('[data-pt-ai-report]').children.length===0);cleanup();check('dispose removes UI',q('#fixture').children.length===0);q('#results').textContent=`${checks}/${checks} local AI browser checks passed`;
}catch(e){q('#results').textContent='FAILED: '+e.stack;}finally{window.fetch=original;}
</script></body></html>
