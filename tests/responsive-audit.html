<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive dashboard audit</title><body style="margin:0;background:#09090b;color:#ddd;font:12px monospace"><p id="result">Loading responsive fixture...</p><iframe title="Responsive dashboard" style="display:block;border:0;height:850px" src="/"></iframe><script type="module">
const width=Number(new URLSearchParams(location.search).get('width'))||375,frame=document.querySelector('iframe');frame.style.width=width+'px';
frame.addEventListener('load',()=>{const doc=frame.contentDocument;function measure(){if(!doc.querySelector('[data-office-preset]'))return setTimeout(measure,100);const rows=[];for(const state of ['initial','preset','terminal']){if(state==='preset'){for(const [name,value]of Object.entries({secret:'ResponsiveTest_2026',enableSecret:'ResponsiveEnable_2026',ntp:'198.18.0.123',syslog:'198.18.0.50'})){const field=doc.querySelector(`[data-settings] [name="${name}"]`);if(field){field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));}}doc.querySelector('[data-office-preset]').click();}if(state==='terminal')doc.querySelector('[data-preset-view]').click();const overflow=doc.documentElement.scrollWidth>width+1;rows.push(`${state}: ${overflow?'FAIL':'PASS'} / viewport ${width}px / content ${doc.documentElement.scrollWidth}px`);}document.querySelector('#result').textContent=rows.join(' | ');document.title=rows.some(r=>r.includes('FAIL'))?'FAIL responsive audit':'PASS responsive audit';frame.contentWindow.scrollTo(0,0);}measure();});
</script></body></html>
