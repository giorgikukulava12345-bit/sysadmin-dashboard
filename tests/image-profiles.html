<!doctype html><html lang="en"><meta charset="utf-8"><title>Image profiles regression</title><pre id="results">Running</pre><div id="fixture"></div><script type="module">
import {mountVpn} from '../static/vpn/ui.js';
const root=document.querySelector('#fixture'),dispose=mountVpn(root),q=s=>document.querySelector(s);let checks=0;
const check=(name,ok)=>{if(!ok)throw Error(name);checks++;};
try{
const model=q('[data-router-model]');model.value='Cisco IOS 3725 (Dynamips) (EVE-NG)';model.dispatchEvent(new Event('change',{bubbles:true}));q('[data-office-vpn-preset]').click();
check('IKEv1 selected automatically',q('[name=protocol]').value==='ikev1');check('profile label follows IOS image',q('#vpn-a-vendor option:checked').textContent.includes('Classic IOS'));
check('modern protocol disabled',q('[name=protocol] option[value=ikev2]').disabled);check('modern advanced suite hidden',q('#vpn-advanced').hidden);
q('[data-action=key]').click();q('[data-generate]').click();
for(const selector of ['[data-code]','[data-peer-code]']){const code=q(selector).textContent;check('legacy suite emitted',code.includes('crypto isakmp policy 100')&&code.includes('hash sha'));check('no rejected modern syntax',!code.includes('crypto ikev2')&&!code.includes('ip virtual-reassembly in'));check('complete crypto map',code.includes('crypto map NOC-MAP')&&code.includes('match address NOC-CRYPTO'));}
check('both device exports enabled',!q('[data-copy-config]').disabled&&!q('[data-copy-peer]').disabled);check('correct names',q('[data-code]').textContent.includes('hostname R1')&&q('[data-peer-code]').textContent.includes('hostname R2'));
dispose();q('#results').textContent=`${checks}/${checks} image profile checks passed`;
}catch(error){q('#results').textContent='FAILED: '+error.message;throw error;}
</script></html>
